# Copy to config.properties; the local copy is ignored by Git.
# Use the training environment and a dedicated test account.
base-url=https://training.example.com
# HTTP Basic authentication for the training environment
username=YOUR_BASIC_AUTH_USERNAME
password=YOUR_BASIC_AUTH_PASSWORD
# Application login (separate from HTTP Basic authentication)
test-email=YOUR_TEST_ACCOUNT_EMAIL
test-password=YOUR_TEST_ACCOUNT_PASSWORD
# Profile-editing scenarios expect this account's initial name
test-display-name=YOUR_TEST_ACCOUNT_DISPLAY_NAME
